<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRE EM CONTATO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section class="py-5 bg-dark text-light" id="contato">
  <div class="container">
    
    <div class="text-center mb-5">
      <h2 class="fw-bold">Contato</h2>
      <p class="text-muted">Envie uma mensagem para nós</p>
    </div>

    <div class="row g-4 justify-content-center">
      
      <div class="col-lg-4">
        <div class="card bg-secondary bg-opacity-10 border-secondary p-4 h-100 text-light">
          <h4 class="fw-bold mb-4">Informações</h4>
          
          <div class="mb-3">
            <span class="text-muted d-block small">E-mail</span>
            <strong>contato@seusite.com</strong>
          </div>

          <div class="mb-3">
            <span class="text-muted d-block small">Localização</span>
            <strong>São Paulo, SP – Brasil</strong>
          </div>

          <div class="mb-3">
            <span class="text-muted d-block small">Atendimento</span>
            <strong>Seg – Sex: 9h às 18h</strong>
          </div>
        </div>
      </div>

    <div class="col-lg-7">
  <div class="card bg-secondary bg-opacity-10 border-secondary p-4 text-light">
    <form action="#" method="POST">
      <div class="row g-3">
        
        <div class="col-12">
          <label for="nome" class="form-label text-light small">NOME COMPLETO</label>
          <input type="text" class="form-control bg-dark text-light border-secondary" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="col-12">
          <label for="email" class="form-label text-light small">G-MAIL</label>
          <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email" placeholder="nome@exemplo.com" required>
        </div>

        <div class="col-12">
          <label for="feedback" class="form-label text-light small">FEEDBACK</label>
          <textarea class="form-control bg-dark text-light border-secondary" id="feedback" name="feedback" rows="4" placeholder="Escreva seu feedback..." required></textarea>
        </div>

        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-primary w-100 py-2">Enviar</button>
        </div>

      </div>
    </form>
  </div>
</div>

    </div>
  </div>
</section>
</body>
</html>
